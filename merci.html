<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Envoyé | Widnie Delice</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Styles spécifiques pour centrer le message de succès */
        .thanks-container {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .success-icon {
            font-size: 5rem;
            color: #4ade80; /* Vert succès */
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-20px);}
            60% {transform: translateY(-10px);}
        }
        .thanks-container h1 {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 15px;
        }
        .thanks-container p {
            color: var(--text-muted);
            font-size: 1.2rem;
            margin-bottom: 30px;
            max-width: 500px;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">WIDNIE.</div>
        <div class="nav-links">
            <a href="index.html">Retour à l'accueil</a>
        </div>
    </nav>

    <main class="container thanks-container">
        <div class="success-icon">
            <i class="fas fa-check-circle"></i>
        </div>
        <h1>Merci beaucoup !</h1>
        <p>Votre message a été transmis avec succès. Widnie Delice vous répondra dans les plus brefs délais.</p>
        <a href="index.html" class="btn-primary">Retourner à l'accueil</a>
    </main>

    <footer>
        <p>© 2026 Widnie Delice | Experte Digitale</p>
    </footer>

</body>
</html>
